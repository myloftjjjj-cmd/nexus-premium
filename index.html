  <body style="background:#070B1F;color:#e2e8f0;margin:0">
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#e2e8f0"><b>Nexus-premium could not start</b><pre style="white-space:pre-wrap;color:#94a3b8;font-size:12px">' + (e.message || "Unknown error") + "</pre></div>";
        }
      });
    </script>
    <div id="buildify-script-container"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
